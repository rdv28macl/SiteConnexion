
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page D'inscription</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <h2>Inscription</h2>
    <form id="signupForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required>
        <label for="password">Password:</label>
        <input type="password" id="password" required>
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" required>
        <button type="submit">Sign Up</button>
    </form>
    <p>As tu déja une compte? <a href="connexion2.html">Se connecter ici!</a></p>
    <script src="signup.js"></script>

</body>
<script type="text/javascript">
document.getElementById('signupForm').addEventListener('submit', function(event) {
   event.preventDefault();

   const username = document.getElementById('username').value;
   const password = document.getElementById('password').value;
   const confirmPassword = document.getElementById('confirmPassword').value;

   if (!username || !password || !confirmPassword) {
       alert('Tous les informations doivent être remplis.');
       return;
   }

   if (password.length < 8) {
       alert('Le mot de passe doit être au moins 8 charactères de long.');
       return;
   }

   if (password !== confirmPassword) {
       alert('Les mots de passe ne sont pas identique.');
       return;
   }

   const users = JSON.parse(localStorage.getItem('users')) || [];

   users.push({ username, password });

   localStorage.setItem('users', JSON.stringify(users));

   alert('Utilisateur est inscrit avec succes!');

   setTimeout(() => {
          window.location.href = 'connexion2.html';
      }, 100);
  });
</script>
    <body>
    </body>
</html>
